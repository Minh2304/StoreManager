name: Build & Release Android APK (OTA Update)

on:
  push:
    branches:
      - release
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Rename APK for OTA Download
        run: cp app/build/outputs/apk/debug/app-debug.apk AFaDa-StoreManager.apk

      - name: Create or Update GitHub Release on branch release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Bản cập nhật mới nhất (OTA Release)"
          files: AFaDa-StoreManager.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
